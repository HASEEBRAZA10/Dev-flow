    const CustomCursor = ({ cursorText, isHovered }) => {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [isTouch, setIsTouch] = useState(false);

      useEffect(() => {
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          setIsTouch(true);
          return;
        }

        const handleMouseMove = (e) => {
          setPos({ x: e.clientX, y: e.clientY });
        };

        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      if (isTouch) return null;

      const ringSize = cursorText ? 72 : isHovered ? 48 : 32;

      return (
        <React.Fragment>
          <div 
            className="fixed top-0 left-0 w-2.5 h-2.5 bg-cyan-400 rounded-full pointer-events-none z-[99999] transition-transform duration-75 ease-out"

                    <div key={item.step} className="rounded-2xl bg-slate-900/90 border border-slate-800 overflow-hidden transition-all">

                  Start Building
                </button>
              </div>
            </div>

                <p className="text-slate-400 text-sm mt-2">Send a simulated query message directly to the DEVFLOW console.</p>
              </div>

              <form onSubmit={handleContactSubmit} className="space-y-6 bg-slate-900/90 p-8 rounded-3xl border border-slate-800 shadow-2xl">
                <div>
                  <label className="block text-xs font-mono uppercase text-slate-400 mb-2">Your Name</label>
                  <input
                    type="text"
                    required
                    value={contactForm.name}
                    onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                    placeholder="Alex Mercer"
                    className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-600 focus:border-cyan-500 outline-none text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-mono uppercase text-slate-400 mb-2">Email Address</label>
                  <input
                    type="email"
                    required
                    value={contactForm.email}
                    onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                    placeholder="alex@devflow.io"
                    className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-600 focus:border-cyan-500 outline-none text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-mono uppercase text-slate-400 mb-2">Message</label>
                  <textarea
                    rows="4"
                    required
                    value={contactForm.message}
                    onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}

                    className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-600 focus:border-cyan-500 outline-none text-sm resize-none"
                  />
                </div>

                <button
                  type="submit"
                  disabled={formStatus.loading}
                  className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-extrabold text-xs uppercase tracking-wider hover:from-cyan-400 hover:to-blue-500 transition-all flex items-center justify-center gap-2 active:scale-95"

                  {formStatus.loading ? 'Sending Transmission...' : 'Send Message'} <Icon name="send" className="w-4 h-4" />
                </button>

                {formStatus.success && (
                  <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs text-center font-mono">
                    ✓ Simulated message logged! (No server request sent).

                  <Icon name="github" className="w-5 h-5" />
                </a>
                <a href="https://linkedin.com" target="_blank" rel="noreferrer" className="hover:text-cyan-400 transition-colors">
                  <Icon name="linkedin" className="w-5 h-5" />
                </a>
                <a href="https://twitter.com" target="_blank" rel="noreferrer" className="hover:text-cyan-400 transition-colors">

    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
